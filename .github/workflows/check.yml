name: Checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_cache: /tmp/yonder-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Use pinned npm
        run: npm install --global npm@11.6.2 --no-audit --no-fund
      - name: Install dependencies
        id: install
        run: |
          npm --version
          npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm test
      - run: npm run build
        if: ${{ !cancelled() }}
      - name: Install Firefox for remote UI checks
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps firefox
      - name: Check UI in Firefox
        if: ${{ !cancelled() }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/yonder-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run smoke:browser
      - name: Export temporary visual review images
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['mobile-demo-direction.png', 'mobile-demo-weak.png', 'mobile-demo-nearby.png', 'mobile-preflight.png', 'small-mobile-demo-direction.png']) {
            const path = 'test-results/browser/' + file;
            if (!fs.existsSync(path)) continue;
            const data = fs.readFileSync(path).toString('base64');
            const count = Math.ceil(data.length / 10000);
            for (let index = 0; index < count; index++) {
              console.log('YONDER_IMAGE_FILE ' + path + ' ' + index + ' ' + count + ' ' + data.slice(index * 10000, (index + 1) * 10000));
            }
          }
          NODE
      - run: npm run worker:check
        if: ${{ !cancelled() }}
      - name: Print dependency failure diagnostics
        if: failure() && steps.install.conclusion == 'failure'
        run: |
          for log in "$npm_config_cache"/_logs/*-debug-0.log; do
            if [ -f "$log" ]; then tail -n 160 "$log"; fi
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-debug-logs
          path: /tmp/yonder-npm-cache/_logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-build-and-lock
          path: |
            dist/
            package-lock.json
            test-results/
          if-no-files-found: ignore
