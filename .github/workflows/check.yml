name: Checks
on:
  push:
    branches: [main, codex/yonder-frontend]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_cache: /tmp/yonder-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Use pinned npm
        run: npm install --global npm@11.6.2 --no-audit --no-fund
      - name: Install dependencies
        id: install
        run: |
          npm --version
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Export initial remote lockfile
        if: success() && hashFiles('package-lock.json') != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const encoded = fs.readFileSync('package-lock.json').toString('base64');
          for (let i = 0; i < encoded.length; i += 12000) console.log('YONDER_LOCK_CHUNK ' + encoded.slice(i, i + 12000));
          NODE
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm test
      - run: npm run build
      - name: Install Firefox for remote UI checks
        run: npx playwright install --with-deps firefox
      - name: Check UI in Firefox
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/yonder-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run smoke:browser
      - run: npm run worker:check
      - name: Print dependency failure diagnostics
        if: failure() && steps.install.conclusion == 'failure'
        run: |
          for log in "$npm_config_cache"/_logs/*-debug-0.log; do
            if [ -f "$log" ]; then tail -n 160 "$log"; fi
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-debug-logs
          path: /tmp/yonder-npm-cache/_logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-build-and-lock
          path: |
            dist/
            package-lock.json
            test-results/
          if-no-files-found: ignore
